name: Update database

on:
  schedule:
    - cron: "18 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Generate OpenRA-Mod-Database.json
        run: npm start
      - name: Compare with published asset
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/latest/download/OpenRA-Mod-Database.json"
          if curl -fsSL "$URL" -o /tmp/current.json 2>/dev/null; then
            if cmp -s /tmp/current.json dist/OpenRA-Mod-Database.json; then
              echo "No changes; skipping publish."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Data changed; publishing."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No existing release yet; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release if changed
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TS="$(date +%Y-%m-%dT%H%M%S)"
          gh release create "v${TS}" dist/OpenRA-Mod-Database.json --title "v${TS}"
